<!DOCTYPE html>
<html>
<head>

    <title>CivicSense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container"></div>
    <select id="languageSelect">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
</select>
    <h1 id="mainTitle">CivicSense</h1>

    <h2 id="complaintHeading">Submit a Complaint</h2>

    <input type="text" id="name" placeholder="Your Name">

    <br><br>
    <select id="category">
    <option value="">Select Category</option>
    <option value="Roads">Roads</option>
    <option value="Water">Water</option>
    <option value="Electricity">Electricity</option>
    <option value="Garbage">Garbage</option>
    <option value="Streetlights">Streetlights</option>
</select>

<br><br>

    <textarea id="complaint" placeholder="Describe your issue"></textarea>

    <br><br>

    <button onclick="submitComplaint()">
        Submit
    </button>
    <h2 id="schemeHeading">Government Scheme Assistant</h2>

<select id="userType">
    <option value="">Select User Type</option>
    <option value="Student">Student</option>
    <option value="Farmer">Farmer</option>
    <option value="Woman">Woman</option>
    <option value="Senior Citizen">Senior Citizen</option>
    <option value="Job Seeker">Job Seeker</option>
</select>

<button onclick="findSchemes()">
    Find Schemes
</button>

<div id="schemeResults"></div>

<hr>
    <h2 id="dashboardHeading">Dashboard</h2>

<div id="dashboard">
    Loading...
</div>

<hr>
    <h2 id="filterHeading">Filter Complaints</h2>

<select id="filterCategory">
    <option value="All">All</option>
    <option value="Roads">Roads</option>
    <option value="Water">Water</option>
    <option value="Electricity">Electricity</option>
    <option value="Garbage">Garbage</option>
    <option value="Streetlights">Streetlights</option>
</select>

<br><br>
    <h2 id="complaintsHeading">All Complaints</h2>

<div id="complaintsList"></div>

    <script type="module" src="script.js"></script>
</div>
</body>
</html>
